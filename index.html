<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panini Tracker 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-950 text-yellow font-sans min-h-screen pb-1">


    <header class="bg-red-900 p-4 sticky top-0 z-20 shadow-md border-b border-yellow-500">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
            <div class="flex items-center gap-3">
                <button id="btn-volver" class="hidden px-3 py-1.5 bg-green-950 hover:bg-gray-700 border border-gray-700 text-yellow-500 font-bold rounded-lg text-sm transition-all">
                    ⬅ Índice
                </button>
                <h1 id="app-titulo" class="text-xl font-mono text-yellow-500">🏆 Panini FWC 2026</h1>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="btn-ver-repetidas" class="px-3 py-1.5 bg-green-950 hover:bg-yellow-500 text-yellow-500 font-bold rounded border text-xs transition-all">
                    🔄 Repetidas
                </button>
                <span id="progreso-txt" class="text-xs font-mono bg-green-950 px-3 py-1.5 rounded border border-gray-700 whitespace-nowrap">0/980 (0%)</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        
        <div id="vista-menu" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>

        <div id="vista-seccion" class="hidden space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-2">
                <h2 id="titulo-seccion-activa" class="text-lg font-semibold text-gray-400 uppercase tracking-wider"></h2>
                <div id="seccion-contador" class="text-sm text-gray-400 font-mono"></div>
            </div>
            <div id="cuadrilla-laminas" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2"></div>
        </div>

        <div id="vista-repetidas" class="hidden space-y-4">
            <h2 class="text-xl font-extrabold text-yellow-500 uppercase tracking-wider flex items-center gap-2">
                🔄 Mis Láminas Repetidas
            </h2>
            <div id="lista-repetidas-contenedor" class="space-y-4">
                </div>
        </div>

    </main>

    <footer class="max-w-4xl mx-auto p-4 mt-8 border-t border-gray-800">
        <div class="flex justify-center">
            <button id="btn-reset" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg text-sm transition-all">
                🗑️ Reset Todo
            </button>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
